<div class="container py-5 mt-5">
  <div class="row g-5">
    
    <div class="col-lg-8">
      <h2 class="fw-bold mb-5">Carrito</h2>

      <div *ngIf="cartItems.length > 0; else emptyCart">
        <div *ngFor="let item of cartItems" class="row align-items-center mb-4 pb-4 border-bottom">
          <div class="col-md-3 text-center">
            <img [src]="item.imageUrl" [alt]="item.name" class="img-fluid rounded mb-3" style="max-height: 120px; object-fit: contain;">
            
            <div class="d-flex align-items-center justify-content-center bg-light rounded-pill p-1 mx-auto" style="width: 100px;">
              <button class="btn btn-sm border-0" (click)="decrementQuantity(item)">-</button>
              <span class="mx-2 fw-bold">{{ item.cantidad }}</span>
              <button class="btn btn-sm border-0" (click)="incrementQuantity(item)">+</button>
            </div>
          </div>

          <div class="col-md-6">
            <h5 class="fw-bold mb-1">{{ item.name }}</h5>
            <p class="small text-muted mb-0">Talla {{ item.tallaElegida }}</p>
            <button class="btn btn-sm btn-link text-danger p-0 mt-2 text-decoration-none" (click)="removeItem(item.detalleCartId)">
              Eliminar
            </button>
          </div>

          <div class="col-md-3 text-end">
            <span class="fs-5 fw-bold">{{ item.price * item.cantidad }} €</span>
          </div>
        </div>
      </div>

      <ng-template #emptyCart>
        <div class="text-center py-5">
          <i class="bi bi-cart-x display-1 text-muted"></i>
          <p class="fs-4 mt-3">Tu carrito está vacío</p>
          <button class="btn btn-dark mt-2 rounded-pill px-4" routerLink="/home">Seguir comprando</button>
        </div>
      </ng-template>
    </div>

    <div class="col-lg-4">
      <div class="p-4 bg-white rounded-3 shadow-sm border border-light-subtle sticky-top" style="top: 100px;">
        <h3 class="fw-bold mb-4">Resumen</h3>
        
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
          <span class="fs-5 text-secondary">Total</span>
          <span class="fs-3 fw-bold">{{ total }} €</span>
        </div>

        <div class="d-grid" *ngIf="!showPaymentForm">
          <button class="btn btn-dark btn-lg rounded-pill py-3 fw-bold" 
                  [disabled]="cartItems.length === 0 || isProcessing"
                  (click)="checkout()">
            <span *ngIf="isProcessing" class="spinner-border spinner-border-sm me-2"></span>
            {{ isProcessing ? 'Cargando...' : 'Pasar por caja' }}
          </button>
        </div>

        <div *ngIf="showPaymentForm" class="mt-2">
          <h6 class="fw-bold text-uppercase mb-3" style="font-size: 0.75rem; letter-spacing: 1px;">Datos del Pago</h6>
          
          <div id="payment-element" class="mb-4">
            </div>

          <div class="d-grid gap-2">
            <button class="btn btn-dark btn-lg rounded-pill py-3 fw-bold"
                    (click)="confirmarPago()"
                    [disabled]="isProcessing">
              <span *ngIf="isProcessing" class="spinner-border spinner-border-sm me-2"></span>
              Pagar {{ total }} €
            </button>
            <button class="btn btn-link text-secondary btn-sm text-decoration-none" 
                    (click)="cancelarPago()" 
                    [disabled]="isProcessing">
              Cancelar
            </button>
          </div>
          
          <div class="mt-3 text-center">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/ba/Stripe_Logo%2C_revised_2016.svg" 
                 alt="Stripe" style="height: 15px; opacity: 0.5;">
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
