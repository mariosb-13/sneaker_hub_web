<div class="container my-5">
  <div class="row align-items-center">

    <aside
      class="col-md-4 mb-4 d-flex flex-column justify-content-center align-items-center text-center">
      <h3 class="fw-bold mb-4">Configuración</h3>
      <ul class="nav flex-column config-menu enlarged-menu w-100 p-0">
        <li class="nav-item">
          <a class="nav-link" [class.active]="activeTab === 'details'"
            (click)="changeTab('details')">
            <i class="bi bi-person me-2"></i> Detalles de cuenta
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [class.active]="activeTab === 'address'"
            (click)="changeTab('address')">
            <i class="bi bi-geo-alt me-2"></i> Dirección de envío
          </a>
        </li>
      </ul>
    </aside>

    <main class="col-md-8 px-md-5">

      <div *ngIf="activeTab === 'details'" class="form-container fade-in">
        <h3 class="text-center fw-bold mb-4 fs-2">Detalles de cuenta</h3>

        <div class="mx-auto" style="max-width: 500px;">

          <div class="text-center mb-4 position-relative profile-pic-section">
            <div
              class="profile-pic-wrapper mx-auto bg-light d-flex align-items-center justify-content-center">
              <img *ngIf="user.profileImageUrl" [src]="user.profileImageUrl"
                alt="Foto de perfil" class="profile-pic">
              <i *ngIf="!user.profileImageUrl"
                class="bi bi-person-fill text-secondary"
                style="font-size: 6rem;"></i>
              <div
                class="profile-pic-overlay d-flex flex-column align-items-center justify-content-center"
                (click)="fileInput.click()">
                <i class="bi bi-camera-fill fs-2 text-white"></i>
                <span class="text-white fw-bold"
                  style="font-size: 0.8rem;">Cambiar</span>
              </div>
              <div *ngIf="uploadingImage"
                class="profile-pic-spinner d-flex align-items-center justify-content-center">
                <div class="spinner-border text-light" role="status"></div>
              </div>
            </div>
            <input type="file" #fileInput style="display: none;"
              accept="image/*" (change)="onFileSelected($event)">
          </div>

          <div class="mb-3">
            <label class="form-label text-muted">Nombre Completo</label>
            <div class="input-icon-wrapper">
              <input type="text" class="form-control custom-pill"
                [(ngModel)]="user.fullName">
              <i class="bi bi-pencil icon-right text-dark"></i>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted">Correo</label>
            <div class="input-icon-wrapper">
              <input type="email" class="form-control custom-pill"
                [(ngModel)]="user.email" readonly>
              <i class="bi bi-at icon-right text-dark"></i>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label text-muted">Teléfono</label>
            <div class="input-icon-wrapper">
              <input type="tel" class="form-control custom-pill"
                [(ngModel)]="user.phone"
                (input)="validarSoloNumeros('phone', user.phone)">
              <i class="bi bi-telephone icon-right text-dark"></i>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label text-muted">Contraseña</label>
            <div class="input-icon-wrapper cursor-pointer"
              (click)="changeTab('password')">
              <input type="text" class="form-control custom-pill cursor-pointer"
                value="Cambiar Contraseña" readonly>
              <i class="bi bi-chevron-right icon-right text-dark"></i>
            </div>
          </div>

          <div class="text-end mt-4">
            <p class="text-danger small fw-bold" *ngIf="errorMessage">{{
              errorMessage }}</p>
            <span class="text-success fw-bold me-3" *ngIf="profileMessage">{{
              profileMessage }}</span>
            <button class="btn btn-dark rounded-pill px-4 py-2 guardar-btn"
              (click)="saveProfile()"
              [disabled]="uploadingImage">Guardar</button>
          </div>
        </div>
      </div>

      <div *ngIf="activeTab === 'address'" class="form-container fade-in">
        <h3 class="text-center fw-bold mb-4 fs-2">Dirección de envío</h3>

        <div class="mx-auto" style="max-width: 500px;">
          <div class="mb-3">
            <label class="form-label text-muted">Calle y Número</label>
            <div class="input-icon-wrapper">
              <input type="text" class="form-control custom-pill"
                [(ngModel)]="address.street">
              <i class="bi bi-house icon-right text-dark"></i>
            </div>
          </div>

          <div class="mb-3 mt-3">
            <label class="form-label text-muted">Piso, Bloque, Puerta</label>
            <div class="input-icon-wrapper">
              <input type="text" class="form-control custom-pill"
                [(ngModel)]="address.door" placeholder="Ej: 2ºB, Bloque 4...">
              <i class="bi bi-door-open icon-right text-dark"></i>
            </div>
          </div>

          <div class="row mb-4">
            <div class="col-md-6 mb-3 mb-md-0">
              <label class="form-label text-muted">Ciudad</label>
              <div class="input-icon-wrapper">
                <input type="text" class="form-control custom-pill"
                  [(ngModel)]="address.city">
                <i class="bi bi-buildings icon-right text-dark"></i>
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label text-muted">Código Postal</label>
              <div class="input-icon-wrapper">
                <input type="text" class="form-control custom-pill"
                  [(ngModel)]="address.zipCode"
                  (input)="validarSoloNumeros('zipCode', address.zipCode)"
                  maxlength="5">
                <i class="bi bi-mailbox icon-right text-dark"></i>
              </div>
            </div>
          </div>

          <div class="text-end mt-4">
            <p class="text-danger small fw-bold" *ngIf="errorMessage">{{
              errorMessage }}</p>
            <span class="text-success fw-bold me-3" *ngIf="profileMessage">{{
              profileMessage }}</span>
            <button class="btn btn-dark rounded-pill px-4 py-2 guardar-btn"
              (click)="saveProfile()">Guardar Dirección</button>
          </div>
        </div>
      </div>
      <div *ngIf="activeTab === 'password'" class="form-container fade-in">
        <h3 class="text-center fw-bold mb-4 fs-2">Cambiar Contraseña</h3>

        <div class="mx-auto" style="max-width: 500px;">

          <div class="mb-3">
            <label class="form-label text-muted">Contraseña Actual</label>
            <div class="input-icon-wrapper">
              <input type="password" class="form-control custom-pill"
                [(ngModel)]="passwords.current">
              <i class="bi bi-unlock icon-right text-dark"></i>
            </div>
          </div>

          <div class="mb-3 mt-4">
            <label class="form-label text-muted">Nueva Contraseña</label>
            <div class="input-icon-wrapper">
              <input type="password" class="form-control custom-pill"
                [(ngModel)]="passwords.new">
              <i class="bi bi-key icon-right text-dark"></i>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label text-muted">Confirmar Nueva
              Contraseña</label>
            <div class="input-icon-wrapper">
              <input type="password" class="form-control custom-pill"
                [(ngModel)]="passwords.confirm">
              <i class="bi bi-check2-circle icon-right text-dark"></i>
            </div>
          </div>

          <div class="text-end mt-4">
            <p class="text-danger small fw-bold" *ngIf="passwordError">{{
              passwordError }}</p>
            <span class="text-success fw-bold me-3" *ngIf="passwordSuccess">{{
              passwordSuccess }}</span>
            <button class="btn btn-secondary rounded-pill px-3 py-2 me-2"
              (click)="changeTab('details')">Cancelar</button>
            <button class="btn btn-dark rounded-pill px-4 py-2 guardar-btn"
              (click)="updatePassword()">Actualizar Contraseña</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
