<div class="container my-5">
  <div class="row">
    
    <aside class="col-lg-3 mb-4">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h5 class="card-title fw-bold mb-4">Filtros</h5>

          <div class="mb-4" *ngIf="availableModels.length > 0">
            <h6 class="fw-bold border-bottom pb-2">Modelo</h6>
            <div class="form-check" *ngFor="let model of availableModels">
              <input class="form-check-input" type="checkbox" [id]="model" (change)="toggleModel(model, $event)">
              <label class="form-check-label" [for]="model">
                {{ model }}
              </label>
            </div>
          </div>

          <div class="mb-4">
            <h6 class="fw-bold border-bottom pb-2">Talla</h6>
            <div class="d-flex flex-wrap gap-2">
              <button *ngFor="let size of ['38','39','40','41','42','43','44','45']" 
                      type="button"
                      class="btn btn-sm"
                      [class.btn-dark]="selectedSizes.includes(size)"
                      [class.btn-outline-secondary]="!selectedSizes.includes(size)"
                      (click)="toggleSize(size)">
                {{ size }}
              </button>
            </div>
          </div>

          <div class="mb-4">
            <h6 class="fw-bold border-bottom pb-2">Precio Máximo</h6>
            <div class="px-2">
              <input type="range" class="form-range" min="0" max="1000" step="10" 
                     [value]="currentMaxPrice" (input)="updatePrice($event)">
              <div class="d-flex justify-content-between">
                <span class="text-muted">0€</span>
                <span class="fw-bold">{{ currentMaxPrice }}€</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <main class="col-lg-9">
      
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
        <h2 class="h3 fw-bolder text-uppercase mb-0">{{ categoryTitle }}</h2>
        
        <div class="d-flex align-items-center gap-2">
          <label class="text-nowrap mb-0 text-muted">Ordenar por:</label>
          <select class="form-select form-select-sm w-auto" (change)="onSortChange($event)">
            <option value="featured">Destacados</option>
            <option value="priceAsc">Precio: Bajo a Alto</option>
            <option value="priceDesc">Precio: Alto a Bajo</option>
            <option value="name">Nombre: A-Z</option>
          </select>
        </div>
      </div>

      <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
        <div class="col" *ngFor="let item of sneakers">
          <app-sneaker-resume [sneaker]="item"></app-sneaker-resume>
        </div>
      </div>

      <div class="text-center py-5" *ngIf="sneakers.length === 0">
        <i class="bi bi-search display-1 text-muted"></i>
        <p class="mt-3 fs-5 text-muted">No se han encontrado resultados para tu búsqueda.</p>
        <button class="btn btn-dark mt-2" (click)="loadSneakers(undefined)">Ver todo</button>
      </div>
    </main>

  </div>
</div>
