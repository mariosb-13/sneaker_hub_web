<div class="container py-5">
  <div class="row gx-5 align-items-center" *ngIf="sneaker">

    <div class="col-12 col-lg-8 mb-5 mb-lg-0">
      
      <div class="position-relative d-flex flex-column align-items-center justify-content-center bg-white rounded-3 p-4 w-100" 
           style="cursor: grab; height: 450px;"
           (mousedown)="onDragStart($event)"
           (mousemove)="onDragMove($event)"
           (mouseup)="onDragEnd()"
           (mouseleave)="onDragEnd()"
           (touchstart)="onDragStart($event)"
           (touchmove)="onDragMove($event)"
           (touchend)="onDragEnd()">
        
        <ng-container *ngIf="sneaker.images360 && sneaker.images360.length > 0; else staticImg">
          <img *ngFor="let url of sneaker.images360; let i = index"
               [src]="url" 
               [alt]="sneaker.name" 
               class="img-fluid position-absolute" 
               [class.d-none]="i !== currentImageIndex"
               draggable="false" 
               style="max-height: 380px; object-fit: contain; user-select: none; pointer-events: none;">
        </ng-container>
             
        <ng-template #staticImg>
          <img [src]="sneaker.imageUrl" 
               [alt]="sneaker.name" 
               class="img-fluid" 
               draggable="false"
               style="max-height: 380px; object-fit: contain; user-select: none; pointer-events: none;">
        </ng-template>

      </div>
      
    <div class="w-100 px-3 mt-4 d-flex flex-column align-items-center" *ngIf="sneaker.images360 && sneaker.images360.length > 0">
        <input type="range" class="custom-slider w-75" 
               min="0" 
               [max]="sneaker.images360.length - 1" 
               [value]="currentImageIndex"
               (input)="onSliderChange($event)">
               
        <p class="text-muted small mt-3 mb-0" style="letter-spacing: 0.5px; font-size: 0.8rem;">
          Arrastra para ver en 360º
        </p>
      </div>
      
    </div>

    <div class="col-12 col-lg-4">
      <h1 class="fw-bold mb-1 text-dark h2">{{ sneaker.name }}</h1>
      <p class="text-secondary fs-5 mb-3">{{ sneaker.brand }} - {{ sneaker.gender }}</p>

      <p class="fw-bold text-dark display-6 mb-4">{{ sneaker.price }} €</p>

      <div class="mb-4">
        <p class="small fw-bold mb-2">Selecciona tu talla:</p>
        <div class="d-flex flex-wrap gap-2">
          
          <button *ngFor="let size of availableSizes" 
                  class="btn btn-outline-dark rounded-0 px-3"
                  [class.active]="selectedSize === size"
                  (click)="selectSize(size)">
            {{ size }}
          </button>
          
          <p *ngIf="availableSizes.length === 0" class="text-danger mt-2">
            Agotado temporalmente
          </p>

        </div>
      </div>

      <div class="d-grid mt-5">
        <button class="btn btn-dark btn-lg rounded-1 py-3 text-white" 
                [disabled]="!selectedSize"
                (click)="comprarZapatilla()">
          Añadir al carrito
        </button>
      </div>
    </div>

  </div>

  <div *ngIf="!sneaker" class="text-center py-5">
    <div class="spinner-border text-dark" role="status"></div>
    <h3 class="mt-3">Buscando tu zapatilla...</h3>
  </div>
</div>
