<header class="bg-white pt-3 pb-2 sticky-top">
    <div class="mx-2 mx-lg-5">

        <div class="d-flex align-items-center justify-content-between mb-3 flex-nowrap">
            <a routerLink="/" class="navbar-brand d-flex align-items-center flex-shrink-0 me-0 me-lg-3"
                style="cursor: pointer;">
                <img src="assets/icons/Logo_Negro.svg" alt="Logo" class="logo-img" style="height: 30px;">
                <span class="fw-bold ms-1 d-block d-sm-none fs-5">SneakerHub</span>
                <span class="fw-bold ms-2 d-none d-sm-block fs-4">SneakerHub</span>
            </a>

            <form class="d-flex flex-grow-1 mx-2 mx-lg-5 search-container" role="search" style="min-width: 100px;" 
                  (submit)="onSearch(searchInput.value); $event.preventDefault()">
                <div class="input-group w-100">
                    <span class="input-group-text bg-white border-end-0 rounded-start-pill text-secondary px-2 px-lg-3">
                        <i class="bi bi-search"></i>
                    </span>
                    <input #searchInput class="form-control border-start-0 rounded-end-pill shadow-none border-secondary-subtle px-2"
                        type="search" placeholder="Buscar zapatillas..." aria-label="Buscar">
                </div>
            </form>

            <div class="d-flex align-items-center gap-2 gap-lg-3 flex-shrink-0 ms-0 ms-lg-3">
                <a routerLink="/carrito" class="text-dark fs-5 position-relative">
                    <i class="bi bi-cart"></i>
                    <span *ngIf="(cartCount$ | async) !== 0" 
                          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                          style="font-size: 0.55rem; padding: 0.35em 0.5em;">
                        {{ cartCount$ | async }}
                    </span>
                </a>

                <div class="dropdown">
                    <button class="btn p-0 fs-5 bi bi-person-fill border-0" type="button" data-bs-toggle="dropdown"
                        aria-expanded="false"></button>

                    <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                        <ng-container *ngIf="!(isLoggedIn$ | async)">
                            <li><a class="dropdown-item" routerLink="/signin">Únete a nosotros</a></li>
                            <li><a class="dropdown-item" routerLink="/login">Iniciar sesión</a></li>
                        </ng-container>

                        <ng-container *ngIf="isLoggedIn$ | async">
                            <li *ngIf="isAdmin$ | async">
                                <a class="dropdown-item fw-bold text-primary" routerLink="/admin">
                                    <i class="bi bi-gear-fill me-2"></i>Panel de Admin
                                </a>
                            </li>

                            <li><a class="dropdown-item" routerLink="/perfil">Mi Perfil</a></li>
                            <li><a class="dropdown-item" routerLink="/mis-pedidos">Mis Pedidos</a></li>                            
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <button class="dropdown-item text-danger fw-bold" (click)="logout()">
                                    Cerrar sesión
                                </button>
                            </li>
                        </ng-container>
                    </ul>
                </div>
            </div>
        </div>

        <ul class="nav mb-3 border-bottom pb-2 flex-nowrap overflow-auto">
            <li class="nav-item">
                <a class="nav-link text-dark fw-semibold ps-0" routerLink="/products/tendencias"
                    routerLinkActive="fw-bold text-decoration-underline">Tendencias</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-dark fw-semibold" routerLink="/products/hombre"
                    routerLinkActive="fw-bold text-decoration-underline">Hombre</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-dark fw-semibold" routerLink="/products/mujer"
                    routerLinkActive="fw-bold text-decoration-underline">Mujer</a>
            </li>
        </ul>

        <div class="d-flex gap-2 overflow-auto pb-2 scroll-container">
            <button *ngFor="let brand of brands"
                class="btn brand-chip rounded-pill px-3 gap-2 d-flex align-items-center fw-medium text-nowrap border-0"
                [routerLink]="brand.route" 
                routerLinkActive="active" 
                [routerLinkActiveOptions]="brand.name === 'All' ? { exact: true } : { exact: false }">
                
                <img *ngIf="brand.icon" 
                     [src]="brand.icon" 
                     [alt]="brand.name" 
                     [style.height]="brand.iconHeight"
                     style="width: auto;"> 
                     
                {{ brand.name }}
            </button>
        </div>

    </div>
</header>
