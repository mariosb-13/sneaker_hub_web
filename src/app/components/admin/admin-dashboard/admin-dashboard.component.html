<h2 class="fw-bold text-dark mb-4">Resumen del Sistema</h2>

<div class="row g-4 mb-5">
  <div class="col-md-4">
    <div class="card border-0 shadow-sm p-4 h-100 bg-white rounded-4">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <p class="text-secondary small fw-bold text-uppercase mb-1">Ventas del Mes</p>
          <h2 class="fw-bold mb-0 text-dark">{{ ventasMes | number:'1.2-2' }} €</h2>
        </div>
        <div class="bg-success bg-opacity-10 p-3 rounded-3">
          <i class="bi bi-currency-euro text-success fs-3"></i>
        </div>
      </div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card border-0 shadow-sm p-4 h-100 bg-white rounded-4">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <p class="text-secondary small fw-bold text-uppercase mb-1">Stock de Zapatillas</p>
          <h2 class="fw-bold mb-0 text-dark">{{ stockTotal }}</h2>
        </div>
        <div class="bg-warning bg-opacity-10 p-3 rounded-3">
          <i class="bi bi-box-seam text-warning fs-3"></i>
        </div>
      </div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card border-0 shadow-sm p-4 h-100 bg-white rounded-4">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <p class="text-secondary small fw-bold text-uppercase mb-1">Pedidos Pendientes</p>
          <h2 class="fw-bold mb-0" [ngClass]="pedidosPendientes > 0 ? 'text-danger' : 'text-success'">
            {{ pedidosPendientes }}
          </h2>
        </div>
        <div class="p-3 rounded-3" [ngClass]="pedidosPendientes > 0 ? 'bg-danger bg-opacity-10' : 'bg-success bg-opacity-10'">
          <i class="bi fs-3" [ngClass]="pedidosPendientes > 0 ? 'bi-clock-history text-danger' : 'bi-check-circle text-success'"></i>
        </div>
      </div>
    </div>
  </div>
</div>
